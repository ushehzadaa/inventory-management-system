services:
  inventory:
    build: .
    image: integrator-inventory:local
    container_name: integrator-inventory
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      SECRET_KEY: dev-change-me
      ADMIN_EMAIL: admin@integratortool.com
      ADMIN_PASSWORD: Admin@123
    volumes:
      - inventory_data:/app/instance
volumes:
  inventory_data:
